<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | شركة حميد للأدوية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* تنسيق خاص لضمان ظهور الصفحة بشكل احترافي فوراً */
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0984e3, #6c5ce7);
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: white;
            display: flex;
            width: 850px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        .login-info {
            background: #2d3436;
            color: white;
            width: 40%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }
        .login-info i { font-size: 60px; color: #0084ff; margin-bottom: 20px; }
        .login-form-side {
            width: 60%;
            padding: 50px;
            background: #fff;
        }
        h2 { color: #2d3436; margin-bottom: 30px; font-size: 28px; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #b2bec3;
        }
        input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            border: 1px solid #dfe6e9;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: #0984e3; box-shadow: 0 0 8px rgba(9,132,227,0.2); }
        .login-btn {
            background: #0984e3;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-btn:hover { background: #074b83; transform: translateY(-2px); }
        .footer-links { text-align: center; margin-top: 25px; color: #636e72; }
        .footer-links a { color: #0984e3; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-info">
            <i class="fas fa-hand-holding-medical"></i>
            <h1>شركة حميد للأدوية</h1>
            <p>أهلاً بك في نظامنا المتكامل. سجل دخولك للوصول إلى استشاراتك وطلباتك الطبية في صنعاء - شملان.</p>
        </div>

        <div class="login-form-side">
            <h2>تسجيل الدخول</h2>
            <p style="color: #636e72; font-size: 14px; margin-bottom: 20px;">يجب إنشاء حساب أولاً إذا لم يكن لديك حساب موجود.</p>
            <form onsubmit="event.preventDefault(); window.location.href='index.html'">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="ادخل البريد الإلكتروني" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="كلمة المرور" required>
                </div>
                <button type="submit" class="login-btn">دخول إلى النظام</button>
            </form>
            
            <div class="footer-links">
                <p>مستخدم جديد؟ <a href="signup.html">إنشاء حساب جديد</a></p>
                <p><a href="contact.html">تحتاج مساعدة؟ تواصل معنا</a></p>
            </div>
        </div>
    </div>

    <footer style="text-align: center; padding: 10px; background: #2d3436; color: white; position: fixed; bottom: 0; width: 100%;">
        <p>&copy; 2025 شركة حميد للأدوية</p>
    </footer>

</body>
</html>
